<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>OSAS Web App</title>

    <link rel="icon" href="media/ISATU logo.jpg" type="image/png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>
<style>
    /* RESET */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        background: #F2F2F2;
        min-height: 100vh;
    }

    /* LAYOUT */
    .container {
        display: flex;
        min-height: 90vh;
    }

    /* SLIDER */
    .slider-section {
        position: relative;
        flex: 2;
        overflow: hidden;
    }

    .slider-wrapper {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    .slider {
        display: flex;
        transition: transform 1.2s ease-in-out;
    }

    .slider img {
        width: 100%;
        height: 100vh;
        object-fit: cover;
        flex-shrink: 0;
    }

    /* NAV BUTTONS */
    .nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        color: #fff;
        /* opacity: 50%; */
        border: none;
        font-size: 2.5rem;
        padding: 0;
        cursor: pointer;
        z-index: 10;
    }


    .nav.prev {
        left: 20px;
    }

    .nav.next {
        right: 20px;
    }

    .nav:hover {
        opacity: 1;
        color: #000;
        transform: translateY(-50%) scale(1.1);
    }


    /* DOTS */
    .dots {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
    }

    .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin: 0 5px;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        cursor: pointer;
    }

    .dot.active {
        background: #fff;
    }


    /* LOGIN */
    .login-section {
        flex: 1;
        background: #2575FC;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-box {
        background: #fff;
        width: 100%;
        max-width: 360px;
        padding: 30px;
        border-radius: 12px;
        text-align: center;
        position: relative;
    }

    .back-arrow {
        position: absolute;
        top: 15px;
        left: 15px;

        background: none;
        border: none;
        color: #000;
        font-size: 1.8rem;
        cursor: pointer;
        padding: 0;
    }

    .back-arrow:hover {
        transform: translateX(-1px);
        color: #2575FC;
    }

    .logo {
        width: 90px;
        margin-bottom: 15px;
    }

    .login-box h2 {
        color: #000;
        margin-bottom: 30px;
    }

    .login-box p {
        color: #555;
        margin-bottom: 25px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
    }

    .login {
        width: 100%;
        padding: 12px;
        background: #2575FC;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }


    .login:hover {
        background: #1e5edb;
    }

    .options {
        margin-top: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.85rem;
        margin-bottom: 20px;
    }

    .options label {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .options input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
        vertical-align: middle;
    }


    .options a {
        color: #2575FC;
        text-decoration: none;
    }

    .options a:hover {
        text-decoration: underline;
    }

    .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
    }

    .checkbox input {
        width: 16px;
        height: 16px;
        margin: 0;
    }

    .sign {
        color: black;
        text-decoration: none;
        font-size: 0.80rem;
    }

    .sign:hover {
        text-decoration: underline;
    }


    /* RESPONSIVE */
    @media (max-width: 768px) {
        .container {
            flex-direction: column;
        }

        .slider-section {
            height: 40vh;
        }

        .slider img {
            height: 40vh;
        }
    }
</style>

<body>
    <div class="container">

        <!-- LEFT: IMAGE SLIDER -->
        <div class="slider-section">
            <div class="slider-wrapper">
                <div class="slider" id="slider">
                    <img src="media/user1.png">
                    <img src="media/user2.png">
                    <img src="media/user3.png">
                    <img src="media/user4.png">
                    <img src="media/user5.png">
                    <img src="media/user6.png">
                </div>
            </div>

            <!-- Controls -->
            <button class="nav prev" onclick="prevSlide()">❮</button>
            <button class="nav next" onclick="nextSlide()">❯</button>

            <!-- Pagination -->
            <div class="dots" id="dots"></div>
        </div>


        <!-- RIGHT: LOGIN -->
        <div class="login-section">

            <div class="login-box">
                <button class="back-arrow" onclick="window.location.href='index.php'">&#10094;</button>
                <img src="media/logo.png" class="logo" alt="Logo">

                <h2>SIGN-IN</h2>

                <form>
                    <input type="text" placeholder="Email / Student ID" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit" class="login">LOG IN</button>
                    <div class="options">
                        <label class="checkbox">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>

                        <a href="#">Forgot password?</a>
                    </div>
                    <a href="#" class="sign" style="align-items: center;" alt="Sign-in">No Account? Sign-in here.</a>
                </form>
            </div>
        </div>
</body>
<script src="javascript/nav.js" defer></script>

</html>
